name: BPEI - qualité et tests
on:
  push:
    branches:
      - feat/bpei-independent-release-clean
      - feat/p1-mission-operations
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check first-admin bootstrap script syntax
        run: node --check scripts/p0-bootstrap-admin.mjs
      - name: Verify live RLS smoke script syntax without using secrets
        run: node --check scripts/p1-live-rls-smoke.mjs
      - name: Tests du projet (sans données externes)
        run: npm test

  build-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Dry-run first-admin bootstrap without credentials
        run: node scripts/p0-bootstrap-admin.mjs
      - name: Guard check (must refuse execution without private credentials)
        run: |
          if node scripts/p0-bootstrap-admin.mjs --execute; then
            echo "Critical: admin bootstrap executed without configuration."
            exit 1
          fi
      - name: Build then TypeScript check
        run: bun run typecheck
        env:
          VITE_SUPABASE_URL: https://bpei-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: bpei-ci-publishable-key
          SUPABASE_URL: https://bpei-ci.invalid
          SUPABASE_PUBLISHABLE_KEY: bpei-ci-publishable-key
          BPEI_STAGING: "true"
          VITE_BPEI_PUBLIC_FORMS_ENABLED: "false"
