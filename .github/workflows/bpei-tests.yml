name: BPEI - tests automatiques
on:
  push:
    branches:
      - feat/bpei-independent-release-clean
  pull_request:
    branches:
      - main
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests de validation des formulaires
        run: npm test
