name: BPEI - qualité et tests
on:
  push:
    branches:
      - feat/bpei-independent-release-clean
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests du projet (sans données externes)
        run: npm test

  build-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run typecheck
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://bpei-ci.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: bpei-ci-publishable-key
          SUPABASE_URL: https://bpei-ci.invalid
          SUPABASE_PUBLISHABLE_KEY: bpei-ci-publishable-key
          BPEI_STAGING: "true"
          VITE_BPEI_PUBLIC_FORMS_ENABLED: "false"
