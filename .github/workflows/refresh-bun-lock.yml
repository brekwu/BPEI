name: Regenerate BPEI Bun lockfile
on:
  push:
    branches:
      - feat/bpei-independent-release-clean
    paths:
      - .github/workflows/refresh-bun-lock.yml
      - package.json
      - bun.lock
permissions:
  contents: write
jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Re-resolve removed dependencies
        run: bun install --lockfile-only
      - name: Commit regenerated lockfile if changed
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: regenerate Bun lockfile after shop cleanup"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
